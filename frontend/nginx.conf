server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'";

  # Same-origin API access: the browser never needs CORS in this deployment.
  location /api/    { proxy_pass http://api:8000; proxy_set_header X-Request-ID $request_id; }
  location /health/ { proxy_pass http://api:8000; }
  location /docs    { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
